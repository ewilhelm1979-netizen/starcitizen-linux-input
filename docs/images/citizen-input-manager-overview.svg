  <circle cx="83" cy="248" r="7" fill="#e0a33a" stroke="#8c5d12" stroke-width="2"/>
  <text x="115" y="288" fill="#172033" font-family="sans-serif" font-size="17" font-weight="600">Throttle</text>

  <path d="M45 338 L69 327 L82 359 L52 368 Z" fill="#7b899b" stroke="#26364d" stroke-width="2"/>
  <path d="M76 359 L89 327 L113 338 L106 368 Z" fill="#7b899b" stroke="#26364d" stroke-width="2"/>
  <text x="130" y="353" fill="#172033" font-family="sans-serif" font-size="17" font-weight="600">Rudder pedals</text>

  <path d="M50 410 C50 391 63 380 80 380 C97 380 110 391 110 410 C110 429 97 440 80 440 C63 440 50 429 50 410 Z" fill="#3d4b5f" stroke="#172033" stroke-width="2"/>
  <path d="M59 405 C62 389 98 389 101 405 L96 422 C90 432 70 432 64 422 Z" fill="#8b9aab"/>
