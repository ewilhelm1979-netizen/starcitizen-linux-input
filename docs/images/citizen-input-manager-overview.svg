  <text x="130" y="416" fill="#172033" font-family="sans-serif" font-size="17" font-weight="600">SpaceMouse</text>

  <rect x="48" y="479" width="66" height="51" rx="7" fill="#7b899b" stroke="#26364d" stroke-width="2"/>
  <circle cx="65" cy="495" r="5" fill="#d5dde7"/>
  <circle cx="82" cy="495" r="5" fill="#d5dde7"/>
  <circle cx="99" cy="495" r="5" fill="#d5dde7"/>
  <circle cx="65" cy="513" r="5" fill="#d5dde7"/>
  <circle cx="82" cy="513" r="5" fill="#d5dde7"/>
  <circle cx="99" cy="513" r="5" fill="#d5dde7"/>
  <text x="130" y="510" fill="#172033" font-family="sans-serif" font-size="17" font-weight="600">Button box</text>

