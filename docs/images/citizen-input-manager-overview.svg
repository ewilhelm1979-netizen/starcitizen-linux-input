<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Citizen Input Manager architecture overview</title>
  <desc id="desc">Path from generic Linux controller hardware through canonical sysfs discovery, bounded manifests, grouping, access verification, and privacy-aware reporting to separately evidenced Wine and Star Citizen visibility, binding, and gameplay stages.</desc>

  <rect x="0" y="0" width="1440" height="760" fill="#f5f7fa"/>
  <text x="40" y="46" fill="#172033" font-family="sans-serif" font-size="28" font-weight="700">Citizen Input Manager architecture overview</text>
  <text x="40" y="74" fill="#48566a" font-family="sans-serif" font-size="15">Independent stages prevent native detection from being mistaken for Wine, binding, or gameplay success.</text>

  <rect x="30" y="105" width="270" height="475" rx="18" fill="#ffffff" stroke="#526176" stroke-width="2"/>
  <rect x="30" y="105" width="270" height="62" rx="18" fill="#26364d"/>
  <rect x="30" y="145" width="270" height="22" fill="#26364d"/>
  <text x="50" y="137" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="700">Controller hardware</text>
  <text x="50" y="158" fill="#dce5f2" font-family="sans-serif" font-size="12">Generic examples — support varies</text>

  <line x1="72" y1="194" x2="72" y2="222" stroke="#26364d" stroke-width="5" stroke-linecap="round"/>
  <circle cx="72" cy="187" r="9" fill="#db4965" stroke="#8d233a" stroke-width="2"/>
