  <path d="M335 334 L347 342 L335 350 Z" fill="#526176"/>

  <rect x="350" y="105" width="260" height="475" rx="18" fill="#ffffff" stroke="#2876b9" stroke-width="2"/>
  <rect x="350" y="105" width="260" height="62" rx="18" fill="#1769aa"/>
  <rect x="350" y="145" width="260" height="22" fill="#1769aa"/>
  <text x="370" y="137" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="700">Linux input discovery</text>
  <text x="370" y="158" fill="#dceeff" font-family="sans-serif" font-size="12">Bounded, read-only inspection</text>

  <rect x="370" y="190" width="126" height="28" rx="14" fill="#d9f2e4" stroke="#27845a"/>
  <circle cx="388" cy="204" r="6" fill="#27845a"/>
  <text x="402" y="209" fill="#1d6846" font-family="sans-serif" font-size="12" font-weight="700">AUTOMATIC</text>

  <circle cx="383" cy="258" r="6" fill="#1769aa"/>
  <text x="400" y="253" fill="#172033" font-family="sans-serif" font-size="16" font-weight="600">Canonical USB/sysfs</text>
  <text x="400" y="274" fill="#48566a" font-family="sans-serif" font-size="14">ancestor and stable VID:PID</text>

  <rect x="375" y="311" width="210" height="48" rx="10" fill="#edf5fc" stroke="#7aaed8"/>
  <text x="394" y="341" fill="#174c78" font-family="sans-serif" font-size="16" font-weight="600">HIDRAW nodes</text>
  <rect x="375" y="374" width="210" height="48" rx="10" fill="#edf5fc" stroke="#7aaed8"/>
  <text x="394" y="404" fill="#174c78" font-family="sans-serif" font-size="16" font-weight="600">event nodes</text>
  <rect x="375" y="437" width="210" height="48" rx="10" fill="#edf5fc" stroke="#7aaed8"/>
  <text x="394" y="467" fill="#174c78" font-family="sans-serif" font-size="16" font-weight="600">joystick nodes</text>

  <text x="375" y="527" fill="#48566a" font-family="sans-serif" font-size="13">Node numbers are dynamic.</text>
  <text x="375" y="548" fill="#48566a" font-family="sans-serif" font-size="13">Class nodes group by one ancestor.</text>

  <line x1="615" y1="342" x2="645" y2="342" stroke="#526176" stroke-width="4"/>
  <path d="M645 334 L657 342 L645 350 Z" fill="#526176"/>

  <rect x="660" y="105" width="340" height="475" rx="18" fill="#ffffff" stroke="#2876b9" stroke-width="2"/>
  <rect x="660" y="105" width="340" height="62" rx="18" fill="#174c78"/>
  <rect x="660" y="145" width="340" height="22" fill="#174c78"/>
  <text x="680" y="137" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="700">Citizen Input Manager</text>
  <text x="680" y="158" fill="#dceeff" font-family="sans-serif" font-size="12">Fail-closed analysis and policy preview</text>

  <circle cx="691" cy="210" r="6" fill="#1769aa"/>
  <text x="710" y="216" fill="#172033" font-family="sans-serif" font-size="16" font-weight="600">Bounded discovery</text>
  <circle cx="691" cy="252" r="6" fill="#1769aa"/>
  <text x="710" y="258" fill="#172033" font-family="sans-serif" font-size="16" font-weight="600">Strict JSON manifests</text>
  <circle cx="691" cy="294" r="6" fill="#1769aa"/>
  <text x="710" y="300" fill="#172033" font-family="sans-serif" font-size="16" font-weight="600">Physical component grouping</text>
  <circle cx="691" cy="336" r="6" fill="#1769aa"/>
  <text x="710" y="342" fill="#172033" font-family="sans-serif" font-size="16" font-weight="600">Effective access verification</text>
  <circle cx="691" cy="378" r="6" fill="#1769aa"/>
  <text x="710" y="384" fill="#172033" font-family="sans-serif" font-size="16" font-weight="600">Scoped Udev rendering</text>
  <circle cx="691" cy="420" r="6" fill="#1769aa"/>
  <text x="710" y="426" fill="#172033" font-family="sans-serif" font-size="16" font-weight="600">Privacy-aware reports</text>

  <rect x="682" y="468" width="296" height="76" rx="10" fill="#fff4e5" stroke="#c17817" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="700" y="494" fill="#8a4e08" font-family="sans-serif" font-size="14" font-weight="700">CANDIDATE / UNVERIFIED</text>
  <text x="700" y="517" fill="#694319" font-family="sans-serif" font-size="13">Candidate devices are never promoted</text>
  <text x="700" y="536" fill="#694319" font-family="sans-serif" font-size="13">without separate reproducible evidence.</text>

  <line x1="1005" y1="342" x2="1035" y2="342" stroke="#526176" stroke-width="4"/>
  <path d="M1035 334 L1047 342 L1035 350 Z" fill="#526176"/>

  <rect x="1050" y="105" width="360" height="475" rx="18" fill="#ffffff" stroke="#6d5aa8" stroke-width="2"/>
  <rect x="1050" y="105" width="360" height="62" rx="18" fill="#4f3f82"/>
  <rect x="1050" y="145" width="360" height="22" fill="#4f3f82"/>
  <text x="1070" y="137" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="700">Diagnostic layers</text>
  <text x="1070" y="158" fill="#ece7ff" font-family="sans-serif" font-size="12">Every result is reported independently</text>

  <rect x="1070" y="184" width="320" height="49" rx="9" fill="#e4f5ea" stroke="#27845a"/>
  <text x="1086" y="205" fill="#172033" font-family="sans-serif" font-size="14" font-weight="600">Native Linux detection</text>
  <text x="1086" y="223" fill="#1d6846" font-family="sans-serif" font-size="11" font-weight="700">AUTOMATIC CHECK</text>

  <rect x="1070" y="244" width="320" height="49" rx="9" fill="#e4f5ea" stroke="#27845a"/>
  <text x="1086" y="265" fill="#172033" font-family="sans-serif" font-size="14" font-weight="600">Native access verification</text>
  <text x="1086" y="283" fill="#1d6846" font-family="sans-serif" font-size="11" font-weight="700">AUTOMATIC CHECK</text>

  <rect x="1070" y="304" width="320" height="49" rx="9" fill="#fff3db" stroke="#c17817"/>
  <text x="1086" y="325" fill="#172033" font-family="sans-serif" font-size="14" font-weight="600">Wine / DirectInput / WGI visibility</text>
  <text x="1086" y="343" fill="#8a4e08" font-family="sans-serif" font-size="11" font-weight="700">EVIDENCE-ASSISTED CHECK</text>

  <rect x="1070" y="364" width="320" height="49" rx="9" fill="#fff3db" stroke="#c17817"/>
  <text x="1086" y="385" fill="#172033" font-family="sans-serif" font-size="14" font-weight="600">Star Citizen visibility</text>
  <text x="1086" y="403" fill="#8a4e08" font-family="sans-serif" font-size="11" font-weight="700">EVIDENCE-ASSISTED CHECK</text>

  <rect x="1070" y="424" width="320" height="49" rx="9" fill="#eee9fa" stroke="#6d5aa8"/>
  <text x="1086" y="445" fill="#172033" font-family="sans-serif" font-size="14" font-weight="600">Binding verification</text>
  <text x="1086" y="463" fill="#4f3f82" font-family="sans-serif" font-size="11" font-weight="700">MANUAL CONFIRMATION</text>

  <rect x="1070" y="484" width="320" height="49" rx="9" fill="#eee9fa" stroke="#6d5aa8"/>
  <text x="1086" y="505" fill="#172033" font-family="sans-serif" font-size="14" font-weight="600">Gameplay verification</text>
  <text x="1086" y="523" fill="#4f3f82" font-family="sans-serif" font-size="11" font-weight="700">MANUAL CONFIRMATION</text>

  <text x="1070" y="560" fill="#6b3341" font-family="sans-serif" font-size="12" font-weight="600">No later stage is inferred from an earlier result.</text>

  <rect x="30" y="607" width="1380" height="67" rx="14" fill="#ffffff" stroke="#c9d2de"/>
  <text x="50" y="633" fill="#172033" font-family="sans-serif" font-size="14" font-weight="700">Legend</text>
  <circle cx="137" cy="648" r="7" fill="#27845a"/>
  <text x="152" y="653" fill="#344257" font-family="sans-serif" font-size="13">Automatic check</text>
  <circle cx="340" cy="648" r="7" fill="#c17817"/>
  <text x="355" y="653" fill="#344257" font-family="sans-serif" font-size="13">Evidence-assisted check</text>
  <circle cx="590" cy="648" r="7" fill="#6d5aa8"/>
  <text x="605" y="653" fill="#344257" font-family="sans-serif" font-size="13">Manual confirmation</text>
  <rect x="810" y="641" width="14" height="14" rx="3" fill="#fff4e5" stroke="#c17817" stroke-dasharray="3 2"/>
  <text x="836" y="653" fill="#344257" font-family="sans-serif" font-size="13">Candidate / unverified</text>

  <rect x="30" y="694" width="1380" height="46" rx="10" fill="#26364d"/>
  <text x="720" y="713" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">No global HIDRAW access · No MODE=&quot;0666&quot; · No automatic registry edits</text>
  <text x="720" y="730" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">No automatic game startup · No automatic binding changes</text>
</svg>
