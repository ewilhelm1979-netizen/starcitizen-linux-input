<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
<title id="title">Citizen Input Manager physical device selection</title>
<desc id="desc">Sanitized vector capture showing SpaceMouse and Saitek X-56 throttle and stick entries. Ephemeral runtime IDs and unrelated device inventory are covered with opaque redaction bars.</desc>
